name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build model package
        run: pnpm --filter model build

      # -sharedDb is required: without it, DynamoDB Local partitions tables by
      # AWS credentials + region, so a table created here (via whatever
      # credentials this step's `aws` CLI resolves to) could be invisible to
      # the API server's dummy local/local credentials (see dynamodb.ts).
      - name: Start DynamoDB Local
        run: docker run -d -p 8000:8000 amazon/dynamodb-local -jar DynamoDBLocal.jar -inMemory -sharedDb

      # Table name must match DYNAMODB_TABLE in apps/e2e/.env.example.
      - name: Create local DynamoDB table
        run: |
          aws dynamodb create-table \
            --endpoint-url http://localhost:8000 \
            --region us-east-1 \
            --table-name packpixie-test \
            --attribute-definitions \
              AttributeName=PK,AttributeType=S \
              AttributeName=SK,AttributeType=S \
              AttributeName=GSI1PK,AttributeType=S \
              AttributeName=GSI1SK,AttributeType=S \
            --key-schema \
              AttributeName=PK,KeyType=HASH \
              AttributeName=SK,KeyType=RANGE \
            --billing-mode PAY_PER_REQUEST \
            --global-secondary-indexes \
              '[{"IndexName":"GSI1","KeySchema":[{"AttributeName":"GSI1PK","KeyType":"HASH"},{"AttributeName":"GSI1SK","KeyType":"RANGE"}],"Projection":{"ProjectionType":"ALL"}}]'

      # AWS creds let setup-env.sh read the Cognito config and test-user
      # credentials from Secrets Manager — same secrets the deploy workflows use.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Generates apps/e2e/.env.test — Cognito IDs and test-user credentials
      # from Secrets Manager, other values from .env.example defaults. Playwright
      # loads .env.test in-process, so these reach the API/client webServers
      # regardless of Turbo's strict env mode. The test user itself is
      # provisioned by Terraform (infra/cognito.tf).
      - name: Generate .env.test from Secrets Manager
        run: bash apps/e2e/setup-env.sh

      - name: Install Playwright browsers
        run: pnpm --filter @packpixie/e2e run install:browsers

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 7

name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build model package
        run: pnpm --filter model build

      # AWS creds let setup-env.sh read Cognito IDs from Secrets Manager and
      # create the Cognito test user — same secrets deploy-api.yml uses.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Generates apps/e2e/.env.test (Cognito IDs from Secrets Manager, other values
      # from .env.example defaults) and provisions the Cognito test user. Playwright
      # loads .env.test in-process, so these values reach the API/client webServers
      # regardless of Turbo's strict env mode.
      - name: Generate .env.test and provision Cognito test user
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: bash apps/e2e/setup-env.sh

      - name: Install Playwright browsers
        run: pnpm --filter @packpixie/e2e run install:browsers

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 7
